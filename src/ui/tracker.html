<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Time Tracker</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/controls.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/panes.css" />
    <link rel="stylesheet" href="tracker.css" />
    <script type="module" src="tracker.js"></script>
  </head>
  <body>
    <div class="tracker">
      <aside id="sidebar" class="sidebar" data-i18n-label="sidebarLabel">
        <div class="sidebar-header">
          <button class="button primary new-task" type="button" data-ref="new-task" disabled>
            <span data-i18n="sidebarNewTask"></span>
          </button>
          <button
            class="icon-button"
            type="button"
            data-ref="add-entry"
            data-i18n-label="sidebarAddEntry"
            disabled
          ></button>
          <button
            class="icon-button"
            type="button"
            data-ref="more"
            data-i18n-label="sidebarMore"
            aria-haspopup="menu"
          ></button>
        </div>
        <div class="sidebar-scroll scroll" data-ref="sidebar-scroll">
          <div class="mode-header">
            <h2 class="mode-name" id="mode-views" data-i18n="modeViews"></h2>
          </div>
          <tt-tree id="views-tree" aria-labelledby="mode-views"></tt-tree>
          <div class="mode-header">
            <h2 class="mode-name" id="mode-projects" data-i18n="modeProjects"></h2>
            <button
              class="icon-button"
              type="button"
              data-ref="projects-more"
              aria-haspopup="menu"
            ></button>
          </div>
          <tt-tree
            id="projects-tree"
            aria-labelledby="mode-projects"
            persist="tracker.projects"
            dnd
          ></tt-tree>
          <p class="tree-empty" data-ref="projects-empty" data-i18n="trackerEmpty" hidden></p>
        </div>
        <tt-splitter
          controls="sidebar"
          min="100"
          max="480"
          persist="tracker.sidebar"
          data-i18n-label="sidebarResize"
        ></tt-splitter>
      </aside>
      <main id="list" class="list-pane" aria-labelledby="list-title">
        <tt-notification-bar data-ref="notification" hidden></tt-notification-bar>
        <div class="list-header">
          <h1 id="list-title" class="list-title" data-ref="list-title"></h1>
          <span class="list-count num" data-ref="list-count"></span>
          <span class="spacer"></span>
          <button
            class="button small"
            type="button"
            data-ref="quick-filter"
            aria-pressed="false"
            aria-controls="quick-filter-bar"
          >
            <span data-i18n="listQuickFilter"></span>
          </button>
          <button
            class="icon-button"
            type="button"
            data-ref="display-options"
            data-i18n-label="listDisplayOptions"
            aria-haspopup="menu"
          ></button>
        </div>
        <div id="quick-filter-bar" class="quick-filter-bar" data-ref="qfb" hidden>
          <div class="qfb-pills" data-ref="qfb-pills"></div>
          <div class="search-field">
            <input
              class="field"
              type="search"
              data-ref="filter-text"
              data-i18n-label="filterLabel"
              autocomplete="off"
            />
            <kbd data-i18n="filterShortcut"></kbd>
          </div>
        </div>
        <div
          class="quick-filter-tags"
          role="group"
          data-ref="qfb-tags"
          data-i18n-label="filterTagsLabel"
          hidden
        ></div>
        <tt-table id="task-table" class="task-table" data-ref="task-table" hidden></tt-table>
        <p class="list-footer" data-ref="list-footer" hidden>
          <span data-ref="done-hidden"></span>
          <span data-i18n="listSeparator"></span>
          <button class="link-button" type="button" data-ref="show-done">
            <span data-i18n="doneShow"></span>
          </button>
        </p>
        <div class="pane-placeholder list-empty" data-ref="list-empty" hidden>
          <p data-ref="list-empty-text"></p>
          <button class="button" type="button" data-ref="clear-filter" hidden>
            <span data-i18n="filterClear"></span>
          </button>
        </div>
        <div class="visually-hidden" role="status" aria-live="polite" data-ref="live"></div>
      </main>
      <section id="detail" class="detail-pane" data-i18n-label="detailLabel">
        <tt-splitter
          controls="detail"
          pane="after"
          min="320"
          max="900"
          persist="tracker.detail"
          data-i18n-label="detailResize"
        ></tt-splitter>
        <p class="pane-placeholder" data-i18n="detailEmpty"></p>
      </section>
    </div>
  </body>
</html>
